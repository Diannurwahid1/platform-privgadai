[project]
name = "privgadai-ktp-ocr"
version = "0.1.0"
description = "Internal PaddleOCR service for Indonesian KTP documents"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "pillow>=10",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

